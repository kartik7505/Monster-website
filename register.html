<main class="flex-grow pt-[72px] flex items-center justify-center p-space-lg relative overflow-hidden">
  <!-- background effects -->
  <div class="absolute inset-0 z-0 bg-gradient-to-tr from-surface via-background to-surface-container-highest"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-md bg-surface-container/60 backdrop-blur-xl border border-white/5 rounded-2xl p-space-2xl shadow-2xl fade-in-up">
    <div class="text-center mb-space-xl">
      <span class="w-8 h-2 bg-primary-container mx-auto block mb-space-md"></span>
      <h1 class="font-display-hero text-headline-lg uppercase text-white tracking-widest">Enlist Now</h1>
      <p class="font-body-sm text-on-surface-variant mt-space-xs uppercase tracking-widest">Create your profile</p>
    </div>
    
    <form class="flex flex-col gap-space-lg" onsubmit="event.preventDefault(); const pass = document.getElementById('pass').value; const conf = document.getElementById('conf').value; if(pass !== conf){alert('Passwords do not match.'); return;} alert('Profile created successfully! Redirecting...'); window.location.href='index.html';">
      <div>
        <label class="font-label-caps-sm text-outline block mb-space-xs uppercase">Full Name</label>
        <input type="text" required class="w-full bg-surface border border-outline-variant/30 rounded px-space-md py-space-sm text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md" placeholder="Enter your full name" />
      </div>
      <div>
        <label class="font-label-caps-sm text-outline block mb-space-xs uppercase">Email Address</label>
        <input type="email" required class="w-full bg-surface border border-outline-variant/30 rounded px-space-md py-space-sm text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md" placeholder="Enter your email" />
      </div>
      <div>
        <label class="font-label-caps-sm text-outline block mb-space-xs uppercase">Password</label>
        <input type="password" id="pass" required class="w-full bg-surface border border-outline-variant/30 rounded px-space-md py-space-sm text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md" placeholder="Create a password" />
      </div>
      <div>
        <label class="font-label-caps-sm text-outline block mb-space-xs uppercase">Confirm Password</label>
        <input type="password" id="conf" required class="w-full bg-surface border border-outline-variant/30 rounded px-space-md py-space-sm text-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md" placeholder="Confirm your password" />
      </div>
      
      <button type="submit" class="w-full bg-primary-container text-black font-label-caps-lg uppercase py-space-md rounded shadow-[0_0_20px_rgba(0,240,255,0.2)] hover:bg-white hover:shadow-[0_0_25px_rgba(255,255,255,0.4)] transition-all mt-space-sm">
        Create Profile
      </button>
    </form>
    
    <div class="mt-space-xl text-center">
      <p class="font-body-sm text-on-surface-variant">Already have an account? <a href="login.html" class="text-white hover:text-primary-container transition-colors ml-space-xs uppercase font-label-caps-sm tracking-widest border-b border-primary-container/30 pb-0.5">Sign In</a></p>
    </div>
  </div>
</main>
